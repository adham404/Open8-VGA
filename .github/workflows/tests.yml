# Rebuild every ROM image and run the full test suite (CPU, assembler, video, keyboard,
# firmware, games, EEPROM, browser emulator vs. Python simulator, gate-level board).
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build and test
        run: ./build.sh
